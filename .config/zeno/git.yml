snippets:

  - name: git add
    keyword: ga
    snippet: git add {{pathspec}}

  - name: git push
    keyword: gp
    snippet: git push

  - name: git push new branch
    keyword: gpnb
    snippet: git push -u origin HEAD

  - name: git status
    keyword: gs
    snippet: git status --short --branch

  - name: git commit message
    keyword: gcm
    snippet: "git commit -m '{{commit_message}}'"

  - name: git commit message build
    keyword: gcmb
    snippet: "git commit -m 'build({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message chore
    keyword: gcmch
    snippet: "git commit -m 'chore({{optional_scope}}): {{commit_message}} 󰉁 '"

  - name: git commit message ci
    keyword: gcmci
    snippet: "git commit -m 'ci({{optional_scope}}): {{commit_message}} 󰁪 '"

  - name: git commit message docs
    keyword: gcmd
    snippet: "git commit -m 'docs({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message feat
    keyword: gcmfe
    snippet: "git commit -m 'feat({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message fix
    keyword: gcmfi
    snippet: "git commit -m 'fix({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message perf
    keyword: gcmp
    snippet: "git commit -m 'perf({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message refactor
    keyword: gcmrf
    snippet: "git commit -m 'refactor({{optional_scope}}): {{commit_message}} 󰑌 '"

  - name: git commit message revert
    keyword: gcmrv
    snippet: "git commit -m 'revert({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message style
    keyword: gcms
    snippet: "git commit -m 'style({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message test
    keyword: gcmt
    snippet: "git commit -m 'test({{optional_scope}}): {{commit_message}}  '"

  - name: branch
    keyword: B
    snippet: git symbolic-ref --short HEAD
    context:
      lbuffer: '^git\s+checkout\s+'
    evaluate: true

  # gdpr<Space> → PR と同じ差分(マージベース起点)。3点(...)なので main が進んでも影響を受けない
  # 2点(..)だと main 側の他人の変更が逆向きに混ざって当てにならない
  - name: git diff like PR
    keyword: gdpr
    snippet: git diff origin/{{base}}...HEAD

  # gdprf<Space> → 同じ差分のファイル名だけ
  - name: git diff like PR name only
    keyword: gdprf
    snippet: git diff --name-only origin/{{base}}...HEAD

  # gdprs<Space> → 同じ差分の増減サマリ
  - name: git diff like PR stat
    keyword: gdprs
    snippet: git diff --stat origin/{{base}}...HEAD

  # mtree<Space> → 作業ツリーを汚さず仮想マージで衝突チェック(git 2.38+)
  # {{topic}} には HEAD やブランチ名、origin/xxx も入れられる
  - name: git merge-tree conflict check
    keyword: mtree
    snippet: >-
      git fetch origin && git merge-tree --write-tree origin/{{base}} {{topic}}
      && echo '✅ 衝突なし' || echo '💥 衝突あり(上の出力が衝突ファイル)'

  # gwl<Space> → worktree の一覧（パス・HEAD・ブランチ）
  - name: git worktree list
    keyword: gwl
    snippet: git worktree list

  # gwa<Space> → 新規ブランチを切って worktree を作る（issue 単位の作業ツリー用）
  # {{start_point}} には origin/main 等。省略したい場合は消して実行
  - name: git worktree add new branch
    keyword: gwa
    snippet: git worktree add -b {{branch}} {{path}} {{start_point}}

  # gwr<Space> → worktree を削除（ブランチ自体は残る。未コミット変更があると拒否される）
  - name: git worktree remove
    keyword: gwr
    snippet: git worktree remove {{path}}

  # gup<Space> → 現在のブランチの upstream（追跡先）を表示。未設定ならエラー
  - name: git upstream branch
    keyword: gup
    snippet: git rev-parse --abbrev-ref --symbolic-full-name '@{u}'

  # gswc<Space> → リモートブランチを起点にローカルブランチを切って移動
  - name: git switch create from remote
    keyword: gswc
    snippet: git switch -c {{branch}} {{remote_branch}}

  # glf<Space> → ファイルの変更履歴を日付付きで（%as=author date。末尾の行が誕生コミット）
  # 展開後そのまま Tab（zeno-completion）で下の fzf ファイル選択が出る
  - name: git log follow file
    keyword: glf
    snippet: "git log --format='%h %as %s' --follow -- "

  # gcme<Space> → 空コミット（PR アンカー用など。--no-verify は husky 未生成の新規 worktree 対策）
  - name: git commit allow empty
    keyword: gcme
    snippet: "git commit --allow-empty --no-verify -m '{{commit_message}}'"

completions:
  # `git log ... -- ` まで打った状態（glf 展開直後など）で Tab → fzf でファイル選択
  - name: git log file
    patterns:
      - "^git log( .*)? -- $"
    sourceCommand: "git ls-files"
    options:
      --prompt: "'File> '"
      --preview: "git log --format='%h %as %s' --follow -- {} | head -40"

  # `git -C ` の直後に Tab → ghq 管理下のリポジトリパスを fzf で選択
  - name: git -C repo path
    patterns:
      - "^git -C $"
    sourceCommand: "ghq list --full-path"
    options:
      --prompt: "'Repo> '"
      --preview: "git -C {} log --format='%h %as %s' -5 && git -C {} status --short --branch | head -10"

