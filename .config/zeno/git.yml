snippets:

  - name: git add
    keyword: ga
    snippet: git add {{pathspec}}

  - name: git push
    keyword: gp
    snippet: git push

  - name: git push new branch
    keyword: gpnb
    snippet: git push -u origin HEAD

  - name: git status
    keyword: gs
    snippet: git status --short --branch

  - name: git commit message
    keyword: gcm
    snippet: "git commit -m '{{commit_message}}'"

  - name: git commit message build
    keyword: gcmb
    snippet: "git commit -m 'build({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message chore
    keyword: gcmch
    snippet: "git commit -m 'chore({{optional_scope}}): {{commit_message}} 󰉁 '"

  - name: git commit message ci
    keyword: gcmci
    snippet: "git commit -m 'ci({{optional_scope}}): {{commit_message}} 󰁪 '"

  - name: git commit message docs
    keyword: gcmd
    snippet: "git commit -m 'docs({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message feat
    keyword: gcmfe
    snippet: "git commit -m 'feat({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message fix
    keyword: gcmfi
    snippet: "git commit -m 'fix({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message perf
    keyword: gcmp
    snippet: "git commit -m 'perf({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message refactor
    keyword: gcmrf
    snippet: "git commit -m 'refactor({{optional_scope}}): {{commit_message}} 󰑌 '"

  - name: git commit message revert
    keyword: gcmrv
    snippet: "git commit -m 'revert({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message style
    keyword: gcms
    snippet: "git commit -m 'style({{optional_scope}}): {{commit_message}}  '"

  - name: git commit message test
    keyword: gcmt
    snippet: "git commit -m 'test({{optional_scope}}): {{commit_message}}  '"

  - name: branch
    keyword: B
    snippet: git symbolic-ref --short HEAD
    context:
      lbuffer: '^git\s+checkout\s+'
    evaluate: true

  # gdpr<Space> → PR と同じ差分(マージベース起点)。3点(...)なので main が進んでも影響を受けない
  # 2点(..)だと main 側の他人の変更が逆向きに混ざって当てにならない
  - name: git diff like PR
    keyword: gdpr
    snippet: git diff origin/{{base}}...HEAD

  # gdprf<Space> → 同じ差分のファイル名だけ
  - name: git diff like PR name only
    keyword: gdprf
    snippet: git diff --name-only origin/{{base}}...HEAD

  # gdprs<Space> → 同じ差分の増減サマリ
  - name: git diff like PR stat
    keyword: gdprs
    snippet: git diff --stat origin/{{base}}...HEAD

  # mtree<Space> → 作業ツリーを汚さず仮想マージで衝突チェック(git 2.38+)
  # {{topic}} には HEAD やブランチ名、origin/xxx も入れられる
  - name: git merge-tree conflict check
    keyword: mtree
    snippet: >-
      git fetch origin && git merge-tree --write-tree origin/{{base}} {{topic}}
      && echo '✅ 衝突なし' || echo '💥 衝突あり(上の出力が衝突ファイル)'

