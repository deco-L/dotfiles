snippets:
  # cfnparams<Space> → CloudFormation スタックの Parameters を key 昇順で一覧表示
  # {{stack}} にカーソル、^x^n で {{profile}} へ移動。profile は Tab で補完も効く
  - name: aws cfn stack parameters
    keyword: cfnparams
    snippet: |-
      aws cloudformation describe-stacks --stack-name {{stack}} --profile {{profile}} --query "Stacks[0].Parameters" --output json | jq -r 'sort_by(.ParameterKey)[] | "\(.ParameterKey): \(.ParameterValue)"'

completions:
  # aws <subcommand> --profile <TAB>
  - name: aws profile
    patterns:
      - "^aws .*--profile $"
    sourceCommand: "aws configure list-profiles"
    options:
      --prompt: "'AWS Profile> '"

  # AWS_PROFILE=<TAB> (行頭 or export 付き)
  - name: aws profile env
    patterns:
      - "^(export )?AWS_PROFILE=$"
    sourceCommand: "aws configure list-profiles"
    options:
      --prompt: "'AWS Profile> '"

  # aws sso login --profile <TAB> は上の aws profile でカバー

  # aws --region <TAB>
  - name: aws region
    patterns:
      - "^aws .*--region $"
    sourceCommand: "aws ec2 describe-regions --query 'Regions[].RegionName' --output text 2>/dev/null | tr '\\t' '\\n' || printf 'ap-northeast-1\\nap-northeast-3\\nus-east-1\\nus-west-2'"
    options:
      --prompt: "'AWS Region> '"
