snippets:
  # dpsf<Space> → format 付き docker ps。{{fmt}} の位置で Tab を押すとカラムを複数選択できる
  - name: docker ps format
    keyword: dpsf
    snippet: docker ps --format 'table {{fmt}}'

completions:
  # dpsf の {{fmt}} 位置で <TAB> → 表示カラムを複数選択して format 文字列に組み立てる
  # 並び順は選択順ではなくこのリストの順(よく使う順に並べてある)
  - name: docker ps format columns
    patterns:
      - "docker ps.*--format 'table $"
    sourceCommand: "printf 'ID\\nNames\\nImage\\nStatus\\nPorts\\nRunningFor\\nCreatedAt\\nSize\\nCommand\\nNetworks\\nMounts\\nState\\nLabels\\n'"
    options:
      --multi: true
      --prompt: "'Columns> '"
      --header: "'Tab で複数選択 → Enter'"
    # {{.ID}}\t{{.Names}} の形に変換(\t の実体はバックスラッシュ+t の2文字。docker 側が解釈する)
    callback: "awk '{printf \"{{.%s}}\\\\t\", $1}' | sed 's/\\\\t$//'"

  # docker exec/logs/... <TAB> → 起動中コンテナを選択
  - name: docker container
    patterns:
      - "^docker (exec|logs|attach|inspect|top|port)( .*)? $"
    sourceCommand: "docker ps --format '{{.Names}}\\t{{.Image}}\\t{{.Status}}'"
    options:
      --prompt: "'Container> '"
      --header: "'NAME\\tIMAGE\\tSTATUS'"
    callback: "awk '{print $1}'"

  # docker stop/restart/rm <TAB> → 複数選択可
  - name: docker container multi
    patterns:
      - "^docker (stop|restart|rm|kill|pause|unpause)( .*)? $"
    sourceCommand: "docker ps -a --format '{{.Names}}\\t{{.Image}}\\t{{.Status}}'"
    options:
      --multi: true
      --prompt: "'Container> '"
    callback: "awk '{print $1}' | tr '\\n' ' '"

  # docker compose logs/exec/... <TAB> → サービス名を選択
  - name: docker compose service
    patterns:
      - "^docker compose (logs|exec|restart|stop|start|up|build|run|pull|top)( .*)? $"
    sourceCommand: "docker compose config --services 2>/dev/null"
    options:
      --multi: true
      --prompt: "'Service> '"
    callback: "tr '\\n' ' '"

  # docker run/rmi など <TAB> → ローカルイメージを選択
  - name: docker image
    patterns:
      - "^docker (run|rmi|push|history|save)( .*)? $"
    sourceCommand: "docker images --format '{{.Repository}}:{{.Tag}}\\t{{.Size}}' | grep -v '<none>'"
    options:
      --prompt: "'Image> '"
    callback: "awk '{print $1}'"
